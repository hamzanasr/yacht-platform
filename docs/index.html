<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل منصة اليخوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky tab bar + language switch; each app = numbered step list beside a sticky device frame */
:root{
  --bg:#EDF2F3; --surface:#FFFFFF; --surface-2:#F4F8F9; --ink:#0D2730; --muted:#577078; --line:#D2DDE0;
  --sea:#0B6C78; --sea-soft:#DCEEF0; --on-sea:#FFFFFF;
  --brass:#9A6512; --brass-soft:#F5E9D3;
  --ok:#1D7448; --ok-soft:#DDF1E5; --warn:#9A5600; --warn-soft:#FAEAD1; --bad:#B3261E; --bad-soft:#F8DFDC;
  --device:#14262C; --wa-bg:#E9E3DA; --wa-in:#FFFFFF; --qr-ink:#0D2730;
  --shadow:0 28px 60px -32px rgba(9,38,46,.45);
  --font-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#081A1F; --surface:#0F242A; --surface-2:#132B32; --ink:#E2ECEE; --muted:#8DA6AC; --line:#22414A;
    --sea:#45B5C2; --sea-soft:#0F3A42; --on-sea:#04161A;
    --brass:#DDA955; --brass-soft:#3A2C15;
    --ok:#5BC48E; --ok-soft:#12342A; --warn:#E5A44C; --warn-soft:#3A2A12; --bad:#F07C72; --bad-soft:#3E1A17;
    --device:#02080A; --wa-bg:#0B1B20; --wa-in:#16323A; --qr-ink:#0D2730;
    --shadow:0 28px 60px -30px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#081A1F; --surface:#0F242A; --surface-2:#132B32; --ink:#E2ECEE; --muted:#8DA6AC; --line:#22414A;
  --sea:#45B5C2; --sea-soft:#0F3A42; --on-sea:#04161A;
  --brass:#DDA955; --brass-soft:#3A2C15;
  --ok:#5BC48E; --ok-soft:#12342A; --warn:#E5A44C; --warn-soft:#3A2A12; --bad:#F07C72; --bad-soft:#3E1A17;
  --device:#02080A; --wa-bg:#0B1B20; --wa-in:#16323A; --qr-ink:#0D2730;
  --shadow:0 28px 60px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.75}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:6px}
.num,.ltr{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.mono{font-family:var(--font-mono);font-size:.86em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding-inline:20px;display:flex;align-items:center;gap:16px;min-height:60px}
.brand{font-family:var(--font-display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{color:var(--sea);flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-block:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--muted);font-weight:500;padding:7px 12px;border-radius:9px;white-space:nowrap;cursor:pointer;font-size:14px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.lang{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.lang:hover{border-color:var(--sea);color:var(--sea)}
@media (max-width:760px){.brand span{display:none}.top-in{gap:10px}}

.wrap{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:28px 72px}
.panel-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 24px;margin-bottom:24px}
.panel-head h2{font-size:26px}
.panel-head p{color:var(--muted);max-width:62ch}
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--sea);font-weight:600;margin-bottom:4px;display:block}

/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:12px 36px}
.hero h1{font-size:clamp(28px,4.4vw,44px);font-weight:700;letter-spacing:-.01em}
.hero p.lead{font-size:17px;color:var(--muted);margin-top:12px;max-width:54ch}
.money{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.money h3{font-size:15px;font-weight:600}
.money .sub{color:var(--muted);font-size:13px}
.split{display:flex;height:46px;border-radius:10px;overflow:hidden;margin-top:16px;font-weight:600;font-size:13px}
.split > div{display:flex;align-items:center;justify-content:center;padding-inline:8px;white-space:nowrap}
.split .a{background:var(--sea);color:var(--on-sea)}
.split .b{background:var(--brass-soft);color:var(--brass);flex:1}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;font-size:13px}
.legend b{display:block;font-family:var(--font-display);font-size:20px}
.legend .k{color:var(--muted)}
.link-btn{background:none;border:0;color:var(--sea);font-weight:600;cursor:pointer;padding:0;margin-top:14px;font-size:14px}
.link-btn:hover{text-decoration:underline}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:980px){.apps{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}}
@media (max-width:520px){.apps{grid-template-columns:1fr}}
.app-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;text-align:start;cursor:pointer;transition:border-color .15s,transform .15s}
.app-card:hover{border-color:var(--sea);transform:translateY(-2px)}
.app-card .ic{width:38px;height:38px;border-radius:10px;background:var(--sea-soft);color:var(--sea);display:grid;place-items:center}
.app-card h3{font-size:17px}
.app-card p{color:var(--muted);font-size:14px;flex:1}
.app-card .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.app-card .meta b{color:var(--sea)}
.sec-title{font-size:18px;margin:40px 0 14px}
.phases{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.phases{grid-template-columns:1fr}}
.phase{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surface)}
.phase .tag{font-size:12px;font-weight:600;color:var(--brass)}
.phase p{color:var(--muted);font-size:14px}

/* steps */
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:44px;align-items:start}
.app.wide{grid-template-columns:minmax(0,340px) minmax(0,1fr)}
.stage{position:sticky;top:84px}
@media (max-width:920px){.app,.app.wide{grid-template-columns:minmax(0,1fr);gap:22px}.stage{position:static;order:-1}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.step-btn{width:100%;display:flex;align-items:center;gap:12px;background:none;border:1px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer;text-align:start;font-weight:500}
.step-btn:hover{background:var(--surface)}
.step-btn .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.step-li.on .step-btn{background:var(--surface);border-color:var(--line);border-end-start-radius:0;border-end-end-radius:0;border-bottom-color:transparent;font-weight:600}
.step-li.on .n{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.step-li.done .n{color:var(--sea);border-color:var(--sea)}
.step-detail{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:2px 18px 16px;padding-inline-start:52px;display:flex;flex-direction:column;gap:12px}
.req{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.req li{position:relative;padding-inline-start:16px}
.req li::before{content:"";position:absolute;inset-inline-start:0;top:.7em;width:6px;height:6px;border-radius:2px;background:var(--brass)}
.tool{display:flex;flex-direction:column;gap:2px;background:var(--sea-soft);border-radius:10px;padding:9px 12px;font-size:13.5px}
.tool .k{font-size:11px;font-weight:600;color:var(--sea);letter-spacing:.03em}
.tool b{font-family:var(--font-display);font-weight:600}
.tool.built{background:var(--brass-soft)}
.tool.built .k{color:var(--brass)}
.stage-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.nav-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.nav-btn:hover:not(:disabled){border-color:var(--sea);color:var(--sea)}
.nav-btn:disabled{opacity:.4;cursor:default}
.stage-cap{font-size:13px;color:var(--muted);text-align:center}
.stage-cap b{display:block;color:var(--ink);font-size:14px}
.frame-holder{animation:fade .25s ease}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.frame-holder{animation:none}.app-card{transition:none}}

/* phone mockup */
.phone{width:300px;max-width:100%;margin-inline:auto;aspect-ratio:300/620;background:var(--device);border-radius:44px;padding:10px;box-shadow:var(--shadow);position:relative}
.notch{position:absolute;top:17px;left:50%;transform:translateX(-50%);width:86px;height:22px;background:var(--device);border-radius:12px;z-index:3}
.scr{height:100%;border-radius:35px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column;font-size:11.5px;line-height:1.55;position:relative}
.sb{display:flex;justify-content:space-between;align-items:center;padding:13px 24px 5px;font-weight:600;font-size:11px;direction:ltr;background:var(--surface)}
.bat{width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative;opacity:.8}
.bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12.5px}
.m-head b{font-family:var(--font-display);font-weight:600;text-align:center}
.m-head .side{min-width:46px;color:var(--sea);font-size:11px}
.m-head .side:last-child{text-align:end}
.m-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin}
.m-foot{padding:10px 12px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.m-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px}
.m-card.sel{border-color:var(--sea);box-shadow:0 0 0 1px var(--sea)}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m-muted{color:var(--muted)}
.m-small{font-size:10.5px}
.m-h{font-family:var(--font-display);font-size:14px;font-weight:600}
.m-field{display:flex;flex-direction:column;gap:3px}
.m-field > span{font-size:10px;color:var(--muted)}
.m-input{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--surface);min-height:31px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.m-input.err{border-color:var(--bad)}
.m-err{color:var(--bad);font-size:10px}
.m-2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.m-btn{display:block;text-align:center;background:var(--sea);color:var(--on-sea);border-radius:10px;padding:9px;font-weight:600}
.m-btn.ghost{background:transparent;color:var(--sea);box-shadow:inset 0 0 0 1px var(--sea)}
.m-btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.m-btn.red{background:var(--bad);color:var(--on-sea)}
.m-btn.dis{background:var(--line);color:var(--muted)}
.m-btn.sm{padding:5px 10px;font-size:10.5px;display:inline-block}
.m-chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:600;background:var(--sea-soft);color:var(--sea);white-space:nowrap}
.m-chip.ok{background:var(--ok-soft);color:var(--ok)}
.m-chip.warn{background:var(--warn-soft);color:var(--warn)}
.m-chip.bad{background:var(--bad-soft);color:var(--bad)}
.m-chip.brass{background:var(--brass-soft);color:var(--brass)}
.m-chip.mute{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.m-chips{display:flex;flex-wrap:wrap;gap:5px}
.m-banner{border-radius:10px;padding:8px 10px;font-weight:600;font-size:11px}
.m-banner.ok{background:var(--ok-soft);color:var(--ok)}
.m-banner.warn{background:var(--warn-soft);color:var(--warn)}
.m-banner.brass{background:var(--brass-soft);color:var(--brass)}
.m-hero{border-radius:12px;overflow:hidden;aspect-ratio:2/1}
.boat-img{display:block;width:100%;height:100%}
.m-res{display:grid;grid-template-columns:78px minmax(0,1fr);gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px}
.m-res .th{border-radius:8px;overflow:hidden;aspect-ratio:1/1}
.m-res b{font-size:12px}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;text-align:center}
.prices div{background:var(--surface-2);border-radius:8px;padding:5px 2px}
.prices span{display:block;font-size:9.5px;color:var(--muted)}
.prices b{font-size:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.days div{border:1px solid var(--line);border-radius:9px;padding:5px 0;background:var(--surface);font-size:9.5px;color:var(--muted)}
.days b{display:block;font-size:12px;color:var(--ink)}
.days .we{background:var(--brass-soft);border-color:transparent}
.days .on{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.days .on b{color:var(--on-sea)}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.slot.on{border-color:var(--sea);box-shadow:0 0 0 1px var(--sea)}
.slot.off{opacity:.55;text-decoration:line-through}
.radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.slot.on .radio{border:4px solid var(--sea)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);color:var(--sea);font-weight:700}
.lines{display:flex;flex-direction:column;gap:5px}
.lines .tot{border-top:1px dashed var(--line);padding-top:7px;font-weight:700}
.pay-split{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pay-split div{border-radius:11px;padding:8px}
.pay-split .a{background:var(--sea);color:var(--on-sea)}
.pay-split .b{background:var(--brass-soft);color:var(--brass)}
.pay-split b{display:block;font-family:var(--font-display);font-size:17px}
.pay-split small{font-size:9.5px;opacity:.85;display:block}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;direction:ltr}
.otp span{border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;padding:7px 0;font-weight:700;font-size:14px;min-height:34px}
.otp span.cur{border-color:var(--sea);box-shadow:0 0 0 1px var(--sea)}
.moy{border:1px dashed var(--sea);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;position:relative;background:var(--surface)}
.moy-tag{position:absolute;top:-8px;inset-inline-start:10px;background:var(--sea);color:var(--on-sea);font-size:9px;font-weight:600;border-radius:5px;padding:0 6px}
.applepay{background:var(--ink);color:var(--surface);border-radius:9px;text-align:center;padding:7px;font-weight:600;direction:ltr}
.or{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px;font-size:10px;text-align:center}
.seg span{padding:4px 2px;border-radius:6px;color:var(--muted)}
.seg span.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sea)}
.qr{width:120px;height:120px;display:block;margin-inline:auto;border-radius:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:end}
.wa .m-head{background:var(--sea);color:var(--on-sea);border:0}
.wa .m-head .side{color:var(--on-sea)}
.wa .m-body{background:var(--wa-bg)}
.wa-ava{width:26px;height:26px;border-radius:50%;background:var(--on-sea);color:var(--sea);display:grid;place-items:center;font-weight:700;font-size:11px}
.bubble{background:var(--wa-in);border-radius:12px;border-start-start-radius:3px;padding:8px 10px;max-width:92%;box-shadow:0 1px 1px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:2px}
.bubble .t{font-size:9.5px;color:var(--muted);text-align:end}
.bubble a{color:var(--sea);text-decoration:underline;word-break:break-all}
.wa-day{align-self:center;background:var(--surface);border-radius:7px;padding:2px 9px;font-size:9.5px;color:var(--muted)}
.mlist{display:flex;flex-direction:column}
.mlist > div{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mlist > div:last-child{border-bottom:0}
.mlist .i{color:var(--muted);font-size:10px}
.check{display:inline-flex;align-items:center;gap:5px}
.check i{width:12px;height:12px;border-radius:3px;background:var(--sea);display:inline-block;flex:none}
.check i.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
/* mini calendar (FullCalendar-style week view) */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:9.5px}
.cal-h,.cal-b{display:grid;grid-template-columns:30px repeat(var(--n),minmax(0,1fr))}
.cal-h b{text-align:center;padding:5px 2px;border-inline-start:1px solid var(--line);font-weight:600;font-size:10px;border-bottom:1px solid var(--line)}
.cal-b{height:280px;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 40px)}
.cal-axis{position:relative;color:var(--muted)}
.cal-axis span{position:absolute;inset-inline:0;text-align:center;transform:translateY(-50%);font-size:8.5px;background:var(--surface)}
.cal-axis span:first-child{transform:none}
.cal-col{position:relative;border-inline-start:1px solid var(--line)}
.ev{position:absolute;inset-inline:2px;border-radius:5px;padding:2px 4px;overflow:hidden;line-height:1.3;font-weight:600;border-inline-start:3px solid currentColor}
.ev.ok{background:var(--ok-soft);color:var(--ok)}
.ev.warn{background:var(--warn-soft);color:var(--warn)}
.ev.block{background:repeating-linear-gradient(45deg,var(--surface-2) 0 5px,var(--line) 5px 7px);color:var(--muted)}
.ev.sel{background:var(--sea-soft);color:var(--sea);outline:1.5px dashed var(--sea);outline-offset:-1.5px}
.ev.hit{background:var(--bad-soft);color:var(--bad)}

/* desktop mockup */

}
function qr(seed){
  const n = 25; let s = seed;
  const r = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  const cells = [];

function renderApp(key){
  const host = document.querySelector(`[data-app="${key}"]`);

  host.innerHTML = `<ol class="steps">${steps.map((s, i) => `<li class="step-li"><button class="step-btn" type="button"><span class="n num">${i + 1}</span><span>${T(s.t)}</span></button><div class="step-detail" hidden><p>${T(s.d)}</p><ul class="req">${s.req.map(r => `<li>${T(r)}</li>`).join('')}</ul>${s.tool ? `<div class="tool ${s.tool.built ? 'built' : ''}"><span class="k">${s.tool.built ? L('جاهز في المشروع','Already in the project') : L('أداة جاهزة','Ready-made tool')}</span><b>${s.tool.n}</b><span>${T(s.tool.d)}</span></div>` : ''}</div></li>`).join('')}</ol>
    <div class="stage"><div class="frame-holder"></div><div class="stage-nav"><button class="nav-btn" type="button" data-dir="-1">${L('→ السابق','← Back')}</button><div class="stage-cap"></div><button class="nav-btn" type="button" data-dir="1">${L('التالي ←','Next →')}</button></div></div>`;
  host.querySelectorAll('.step-btn').forEach((b, i) => b.addEventListener('click', () => go(key, i)));
  host.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => go(key, state[key] + Number(b.dataset.dir))));
  go(key, state[key], true);
}
function go(key, i, first){
  const steps = APPS[key].steps; if (i < 0 || i >= steps.length) return;
  state[key] = i;
  const host = document.querySelector(`[data-app="${key}"]`);
  host.querySelectorAll('.step-li').forEach((li, k) => {
    li.classList.toggle('on', k === i); li.classList.toggle('done', k < i);
    li.querySelector('.step-detail').hidden = k !== i;
    li.querySelector('.step-btn').setAttribute('aria-current', k === i ? 'step' : 'false');
  });
  const fh = host.querySelector('.frame-holder');
  fh.innerHTML = steps[i].html();
  if (!first) { fh.style.animation = 'none'; void fh.offsetWidth; fh.style.animation = ''; }
  host.querySelector('.stage-cap').innerHTML = `<b>${T(steps[i].t)}</b>${L('الخطوة','Step')} ${i + 1} ${L('من','of')} ${steps.length}`;
  const [prev, next] = host.querySelectorAll('.nav-btn');
  prev.disabled = i === 0; next.disabled = i === steps.length - 1;
}
function showTab(id, user){
  if (!TABS.some(t => t[0] === id)) id = 'overview';
  state.tab = id;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === id ? 'true' : 'false'));
  document.querySelectorAll('.panel').forEach(p => p.hidden = p.id !== 'p-' + id);
  if (user) { try { history.replaceState(null, '', '#' + id); } catch (e) {} window.scrollTo({ top: 0 }); }
  const t = document.getElementById('t-' + id); if (t) t.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

document.addEventListener('keydown', e => {
  if (e.target.closest('input')) return;
  const cur = state.tab; if (!APPS[cur]) return;
  const fwd = lang === 'ar' ? 'ArrowLeft' : 'ArrowRight', back = lang === 'ar' ? 'ArrowRight' : 'ArrowLeft';

/* ───────── calculator (port of src/pricing/pricing-engine.ts) ───────── */
const bps = (a, b) => Math.floor((a * b + 5000) / 10000);
function quote(v){
  const H = x => Math.round((Number(x) || 0) * 100);
  const rate = H(v.price), fee = H(v.extra), online = H(v.online), dock = H(v.dock), credit = Math.max(0, H(v.credit));
  const g = Math.round(Number(v.guests) || 0), base = Math.round(Number(v.base) || 0), max = Math.round(Number(v.max) || 0);
  const comm = H(v.comm);
  if (g < 1) return { err: L('لازم ضيف واحد على الأقل.', 'At least one guest is required.') };
  if (base < 1 || base > max) return { err: L('السعة الأساسية لازم تكون بين 1 والسعة القصوى.', 'Base capacity must be between 1 and max capacity.') };
  if (g > max) return { err: L(`القارب مرخص لـ ${max} ركاب فقط، والمطلوب ${g}.`, `The boat is licensed for ${max} guests; ${g} requested.`) };
  if (comm < 0 || comm > 10000) return { err: L('نسبة العمولة لازم تكون بين 0 و100%.', 'Commission must be between 0 and 100%.') };
  const extraG = Math.max(0, g - base), extraFee = extraG * fee, sub = rate + extraFee;
  const gross = bps(sub, comm), floor = bps(gross, 3000);
  let disc = 0, partner = 0, clamped = false;
  if (v.aff) {
    const room = gross - floor;
    const wd = bps(sub, H(v.disc)); disc = Math.min(wd, room);
    const wp = bps(gross - disc, H(v.pcomm)); partner = Math.min(wp, room - disc);
    clamped = disc < wd || partner < wp;
  }
  const net = gross - disc, platform = net - partner, deposit = net + online;
  const applied = Math.min(credit, deposit), due = deposit - applied, balance = sub - gross + dock;
  if (due > 0 && due < 100) return { err: L('المبلغ الأونلاين أقل من الحد الأدنى لبوابة الدفع (1 ر.س).', 'Online amount is below the payment gateway minimum (1 SAR).') };
  return { rate, extraG, fee, extraFee, sub, gross, comm, disc, partner, platform, online, dock, deposit, applied, credit, due, balance, total: deposit + balance, clamped };
}
const PRESETS = [
  { n: ['مثال أساسي','Basic'], v: { price: 3000, comm: 15, guests: 6, base: 7, max: 10, extra: 150, online: 0, dock: 0, aff: false, disc: 5, pcomm: 10, credit: 0 } },
  { n: ['نهاية أسبوع + إضافات','Weekend + add-ons'], v: { price: 3500, comm: 20, guests: 9, base: 7, max: 10, extra: 150, online: 400, dock: 600, aff: false, disc: 5, pcomm: 10, credit: 0 } },
  { n: ['مع كود شريك','With partner code'], v: { price: 3000, comm: 15, guests: 6, base: 7, max: 10, extra: 150, online: 0, dock: 0, aff: true, disc: 5, pcomm: 10, credit: 0 } },
  { n: ['شريك بنسب عالية','Generous partner'], v: { price: 3000, comm: 15, guests: 6, base: 7, max: 10, extra: 150, online: 0, dock: 0, aff: true, disc: 10, pcomm: 50, credit: 0 } },
  { n: ['عطلة + تذكرة 450','Holiday + 450 pass'], v: { price: 4000, comm: 15, guests: 6, base: 7, max: 10, extra: 150, online: 0, dock: 0, aff: false, disc: 5, pcomm: 10, credit: 450 } },
];
const F = ['price', 'comm', 'guests', 'base', 'max', 'extra', 'online', 'dock', 'disc', 'pcomm', 'credit'];
const $ = id => document.getElementById(id);
const sar = h => { const neg = h < 0; h = Math.abs(h); const s = (h / 100).toLocaleString('en-US', { minimumFractionDigits: h % 100 ? 2 : 0, maximumFractionDigits: 2 }); return (neg ? '−' : '') + s; };
function fill(v){ F.forEach(f => $('c-' + f).value = v[f]); $('c-aff').checked = v.aff; }
function initCalc(){
  $('presets').innerHTML = PRESETS.map(p => `<button type="button" class="pre">${T(p.n)}</button>`).join('');
  document.querySelectorAll('.pre').forEach((b, i) => b.addEventListener('click', () => { state.preset = i; state.calc = { ...PRESETS[i].v }; fill(state.calc); markPreset(); calc(); }));
  $('calc-form').addEventListener('input', () => { state.preset = -1; markPreset(); calc(); });
  $('calc-form').addEventListener('submit', e => e.preventDefault());
  fill(state.calc || PRESETS[0].v); markPreset(); calc();
}
function markPreset(){ document.querySelectorAll('.pre').forEach((b, i) => b.classList.toggle('on', i === state.preset)); }
function calc(){
  const v = {}; F.forEach(f => v[f] = $('c-' + f).value); v.aff = $('c-aff').checked; state.calc = v;
  $('l-disc').hidden = !v.aff; $('l-pcomm').hidden = !v.aff;
  const q = quote(v), note = $('r-note');
  if (q.err) {
    $('r-due').textContent = '—'; $('r-bal').textContent = '—'; $('r-lines').innerHTML = '';
    $('bar-a').style.width = '0'; $('bar-b').style.width = '0';
    note.innerHTML = `<div class="r-note bad">${q.err}</div>`; return;
  }
  $('r-due').textContent = sar(q.due); $('r-bal').textContent = sar(q.balance);
  const tot = q.due + q.balance || 1;
  $('bar-a').style.width = (q.due / tot * 100) + '%'; $('bar-b').style.width = (q.balance / tot * 100) + '%';
  const row = (a, b, cls = '') => `<div class="row ${cls}"><span>${a}</span><span>${b}</span></div>`;
  let h = `<div class="grp">${L('العميل','Client')}</div>`;
  h += row(L('سعر الرحلة','Trip price'), sar(q.rate));
  if (q.extraG) h += row(L(`ضيوف إضافيين (${q.extraG} × ${sar(q.fee)})`, `Extra guests (${q.extraG} × ${sar(q.fee)})`), sar(q.extraFee));
  if (q.online) h += row(L('إضافات أونلاين','Online add-ons'), sar(q.online));
  if (q.dock) h += row(L('إضافات في المرسى','Dock add-ons'), sar(q.dock));
  if (q.disc) h += row(L('خصم الشريك','Partner discount'), '−' + sar(q.disc));
  h += row(L('الإجمالي على العميل','Client total'), sar(q.total) + ' ' + SAR(), 'strong');
  if (q.applied) h += row(L('مخصوم من التذكرة','Paid by pass'), '−' + sar(q.applied));
  h += `<div class="grp">${L('توزيع عمولة المنصة','Platform commission split')} (${q.comm / 100}%)</div>`;
  h += row(L('العمولة الإجمالية','Gross commission'), sar(q.gross));
  if (q.disc) h += row(L('منها خصم للعميل','of which client discount'), sar(q.disc));
  if (q.partner) h += row(L('منها ربح الشريك','of which partner earning'), sar(q.partner));
  h += row(L('صافي المنصة','Platform net'), sar(q.platform) + ' ' + SAR(), 'strong');
  $('r-lines').innerHTML = h;
  let n = '';
  if (q.clamped) n += `<div class="r-note warn">${L('نسب الشريك تجاوزت المسموح، فتم تقييدها حتى تحتفظ المنصة بـ30% من عمولتها. مبلغ الكابتن ما تغيّر.','Partner rates exceeded the limit and were capped so the platform keeps 30% of its commission. The captain’s amount is unchanged.')}</div>`;
  if (q.applied && q.applied < q.credit) n += `<div class="r-note warn">${L('رصيد التذكرة أكبر من العربون، والزيادة ما تُسترد.','The pass is worth more than the deposit; the extra is not refunded.')}</div>`;
  note.innerHTML = n;
}

  EMERGENCY_RESCHEDULED: { n: ['إعادة جدولة طارئة','Emergency rescheduled'], c: 'var(--brass)', what: ['خفر السواحل أو الطقس أوقف الإبحار.','The Coast Guard or weather stopped sailing.'], who: ['الإدارة (إيقاف الإبحار)','Admin (sailing suspension)'], money: ['تذكرة بقيمة العربون صالحة 90 يوم.','Pass worth the deposit, valid 90 days.'], notify: ['العميل والكابتن تلقائياً.','Client and captain, automatically.'] },
