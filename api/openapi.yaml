          properties: { name: { $ref: '#/components/schemas/Localized' }, latitude: { type: number }, longitude: { type: number } }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        guests: { type: integer }
        depositHalalas: { type: integer }
        balanceDueToCaptainHalalas: { type: integer }
        manifestComplete: { type: boolean }
