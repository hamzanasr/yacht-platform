        referralLink: { type: string, format: uri }
        clientDiscountBps: { type: integer }
        partnerCommissionBps: { type: integer }
        pendingHalalas: { type: integer }
        availableHalalas: { type: integer }
        lifetimeEarnedHalalas: { type: integer }
    AffiliateTxn:
      type: object
      properties:
